<!-- Primary Interactive Card -->

<span class="font-mono text-body-sm text-primary font-bold" dir="ltr">+20</span>
<span class="material-symbols-outlined text-[18px]">keyboard_arrow_down</span>
</div>
<!-- Input Field -->
<input class="flex-1 bg-transparent py-3.5 px-3 text-right font-body-md text-body-md text-primary placeholder:text-outline outline-none" id="identifier-input" inputmode="numeric" placeholder="010 xxxx xxxx" type="tel"/>

<div class="pl-3.5 text-outline flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">call</span>

<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="sr-only peer" id="remember-checkbox" type="checkbox"/>
<div class="w-5 h-5 rounded bg-surface-container peer-checked:bg-secondary flex items-center justify-center transition-all shadow-inner">
<span class="material-symbols-outlined text-[16px] text-on-secondary opacity-0 peer-checked:opacity-100 font-bold transition-opacity">check</span>
</div>

      </span>

<span class="material-symbols-outlined text-secondary-fixed-dim text-[20px]">login</span>

<span class="material-symbols-outlined text-secondary-fixed-dim text-[18px]">arrow_back</span>
</button>
<!-- Biometric Authentication Floating Option -->
<div class="relative flex py-1 items-center justify-center">
<div class="flex-grow bg-surface-container h-[1px]"></div>
<span class="flex-shrink mx-3 font-label-sm text-label-sm text-outline">أو المصادقة الفورية</span>
<div class="flex-grow bg-surface-container h-[1px]"></div>

<span class="material-symbols-outlined text-secondary text-[20px]">sms</span>
<span class="font-medium">رمز الـ OTP</span>
</button>
</div>
</div>
<!-- Real Estate Assistance & Concierge Card -->
<div class="mt-4 p-space-md bg-surface-container-low rounded-xl flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-fixed/40 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[20px]">support_agent</span>
</div>
<div class="text-right">
<h4 class="font-label-lg text-label-lg text-primary">المساعد العقاري الخاص</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">متاح على مدار الساعة للمستثمرين</p>
</div>
</div>
<button aria-label="الاتصال بالخدمة الفورية" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">chevron_left</span>
</button>
</div>

<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      ليس لديك حساب استثماري بعد؟
      <button class="font-label-lg text-label-lg text-secondary font-bold mr-1 hover:underline transition-all" type="button">
        تقديم طلب مستثمر جديد
      </button>
</p>
</div>
</div>
<script>
  // Password Visibility Toggle Interaction
  const toggleBtn = document.getElementById('toggle-password-btn');
  const passwordField = document.getElementById('password-input');
  const eyeIcon = document.getElementById('password-eye-icon');

  if (toggleBtn && passwordField && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordField.getAttribute('type') === 'password';
      passwordField.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
    });
  }

  // Smooth CTA Feedback Micro-interaction
  const loginBtn = document.getElementById('submit-login-btn');
  if (loginBtn) {
    loginBtn.addEventListener('click', () => {
      loginBtn.classList.add('opacity-90');
      setTimeout(() => {
        loginBtn.classList.remove('opacity-90');
      }, 200);
    });
  }
</script></main></body></html>
